<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activation des notifications</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #f9f9f9; color: #333; }
        .box { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="box">
        <h2 id="status">Demande d'autorisation des notifications...</h2>
        <p>Veuillez accepter la pop-up de votre navigateur.</p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-messaging-compat.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyCjh-8QKGlPXvaGebV4mUzOS1nZTsvic24",
        authDomain: "notif-pronos.firebaseapp.com",
        projectId: "notif-pronos",
        storageBucket: "notif-pronos.firebasestorage.app",
        messagingSenderId: "38774071291",
        appId: "1:38774071291:web:9a651309225128598d355e"
      };

      firebase.initializeApp(firebaseConfig);
      const messaging = firebase.messaging();

      async function initPush() {
        try {
          const permission = await Notification.requestPermission();
          if (permission === 'granted') {
            document.getElementById('status').innerText = "Génération du jeton...";
            
            const token = await messaging.getToken({
              vapidKey: 'BOIFbJ36HvSEWbG_0ztnYhAgk297l2b_sLkkkFrq2-NK5PEswJm1aupdn6kGCG3-mJK-S5QLAU2lUZwpaqwN3aQ'
            });

            if (token) {
              const urlParams = new URLSearchParams(window.location.search);
              const userId = urlParams.get('user_id');

              if (!userId) {
                document.getElementById('status').innerText = "Erreur : ID utilisateur manquant dans l'URL.";
                return;
              }

              document.getElementById('status').innerText = "Enregistrement en cours...";

              // Enregistrement sécurisé dans la table Joueurs de Supabase via l'API REST
              const response = await fetch(`https://TON_PROJECT_REF.supabase.co/rest/v1/Joueurs?id=eq.${userId}`, {
                method: 'PATCH',
                headers: {
                  'Content-Type': 'application/json',
                  'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1em5ucGh5dWxicm54am9qbm5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NTg2NzUsImV4cCI6MjA5NzUzNDY3NX0.Gx70QsVuPp7Srfo-IAj5eJdiwo4waoHt4yN01Nm9SBM',
                  'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1em5ucGh5dWxicm54am9qbm5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NTg2NzUsImV4cCI6MjA5NzUzNDY3NX0.Gx70QsVuPp7Srfo-IAj5eJdiwo4waoHt4yN01Nm9SBM'
                },
                body: JSON.stringify({ push_token: token })
              });

              if (response.ok) {
                document.getElementById('status').innerHTML = "✅ <strong>Notifications activées avec succès !</strong><br><br>Tu peux fermer cette page et retourner sur l'application.";
              } else {
                document.getElementById('status').innerText = "Erreur lors de l'enregistrement dans la base de données.";
              }
            }
          } else {
            document.getElementById('status').innerText = "❌ Permission refusée. Tu dois autoriser les notifications dans les réglages de ton navigateur.";
          }
        } catch (error) {
          console.error(error);
          document.getElementById('status').innerText = "Erreur technique : " + error.message;
        }
      }

      initPush();
    </script>
</body>
</html>
