<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activation des notifications</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 80px; background: #f9f9f9; color: #333; }
        .box { background: white; padding: 40px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; }
        .btn { background-color: #28a745; color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 20px; }
        .btn:hover { background-color: #218838; }
    </style>
</head>
<body>
    <div class="box">
        <h2 id="status">Dernière étape !</h2>
        <p>Clique sur le bouton ci-dessous pour autoriser les notifications sur ton smartphone.</p>
        <button id="activate-btn" class="btn" onclick="initPush()">🔔 Activer les notifications</button>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
      import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-messaging.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCjh-8QKGlPXvaGebV4mUzOS1nZTsvic24",
        authDomain: "notif-pronos.firebaseapp.com",
        projectId: "notif-pronos",
        storageBucket: "notif-pronos.firebasestorage.app",
        messagingSenderId: "38774071291",
        appId: "1:38774071291:web:9a651309225128598d355e"
      };

      const app = initializeApp(firebaseConfig);
      const messaging = getMessaging(app);

      window.initPush = async function() {
        const btn = document.getElementById('activate-btn');
        btn.style.display = 'none'; // Cache le bouton pendant le chargement
        
        try {
          document.getElementById('status').innerText = "Demande d'autorisation en cours...";
          const permission = await Notification.requestPermission();
          
          if (permission === 'granted') {
            document.getElementById('status').innerText = "Enregistrement du service worker...";
            
            const registration = await navigator.serviceWorker.register('/notif-pronos/firebase-messaging-sw.js');

            document.getElementById('status').innerText = "Génération du jeton...";
            
            const token = await getToken(messaging, {
              vapidKey: 'BOIFbJ36HvSEWbG_0ztnYhAgk297l2b_sLkkkFrq2-NK5PEswJm1aupdn6kGCG3-mJK-S5QLAU2lUZwpaqwN3aQ',
              serviceWorkerRegistration: registration
            });

            if (token) {
              const urlParams = new URLSearchParams(window.location.search);
              const userId = urlParams.get('user_id');

              if (!userId) {
                document.getElementById('status').innerText = "Erreur : ID utilisateur manquant dans l'URL.";
                return;
              }

              document.getElementById('status').innerText = "Enregistrement dans la base...";

              const response = await fetch(`https://puznnphyulbrnxjojnnc.supabase.co/rest/v1/Joueurs?id=eq.${userId}`, {
                method: 'PATCH',
                headers: {
                  'Content-Type': 'application/json',
                  'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1em5ucGh5dWxicm54am9qbm5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NTg2NzUsImV4cCI6MjA5NzUzNDY3NX0.Gx70QsVuPp7Srfo-IAj5eJdiwo4waoHt4yN01Nm9SBM',
                  'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1em5ucGh5dWxicm54am9qbm5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NTg2NzUsImV4cCI6MjA5NzUzNDY3NX0.Gx70QsVuPp7Srfo-IAj5eJdiwo4waoHt4yN01Nm9SBM'
                },
                body: JSON.stringify({ push_token: token })
              });

              if (response.ok) {
                document.getElementById('status').innerHTML = "✅ <strong>Notifications activées avec succès !</strong><br><br>Tu peux fermer cette page et retourner sur l'application.";
              } else {
                document.getElementById('status').innerText = "Erreur lors de l'enregistrement dans la base de données.";
              }
            }
          } else {
            document.getElementById('status').innerHTML = "❌ <strong>Permission refusée.</strong><br>Tu dois autoriser les notifications dans les réglages de ton navigateur.";
            btn.style.display = 'inline-block'; // Réaffiche le bouton si refusé
          }
        } catch (error) {
          console.error(error);
          document.getElementById('status').innerText = "Erreur technique : " + error.message;
          btn.style.display = 'inline-block';
        }
      }
    </script>
</body>
</html>
